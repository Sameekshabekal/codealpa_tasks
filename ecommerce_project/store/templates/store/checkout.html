{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | ShopSphere</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<header class="navbar">

    <div class="container nav-content">

        <a href="/" class="logo">
            Shop<span>Sphere</span>
        </a>

        <nav>
            <a href="/">Home</a>
            <a href="/#products">Products</a>
            <a href="/about/">About</a>
        </nav>

        <div class="nav-actions">
            <a href="/cart/" class="cart-btn">🛒 Cart</a>
        </div>

    </div>

</header>


<section class="products-section">

    <div class="container">

        <p class="eyebrow">CHECKOUT</p>

        <h1>Complete Your Order</h1>

        <div style="
            max-width:700px;
            margin:35px auto;
        ">

            <div style="
                padding:25px;
                border:1px solid #e5e7eb;
                border-radius:14px;
                background:white;
            ">

                <h2>Order Summary</h2>

                {% for item in items %}

                    <div style="
                        display:flex;
                        justify-content:space-between;
                        padding:18px 0;
                        border-bottom:1px solid #eee;
                    ">

                        <div>
                            <strong>{{ item.product.name }}</strong>

                            <p style="color:#64748b;">
                                Quantity: {{ item.quantity }}
                            </p>
                        </div>

                        <strong>
                            ₹{{ item.total }}
                        </strong>

                    </div>

                {% endfor %}


                <div style="
                    display:flex;
                    justify-content:space-between;
                    margin-top:25px;
                    font-size:20px;
                ">

                    <strong>Total</strong>

                    <strong>₹{{ total }}</strong>

                </div>

            </div>


            <div style="
                margin-top:25px;
                padding:25px;
                border:1px solid #e5e7eb;
                border-radius:14px;
                background:white;
            ">

                <h2>Delivery Details</h2>

                <form method="POST">

                    {% csrf_token %}

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="full_name"
                        placeholder="Enter your full name"
                        required
                        style="width:100%; padding:14px; margin:8px 0 20px; border:1px solid #ddd; border-radius:8px;"
                    >

                    <label>Address</label>

                    <textarea
                        name="address"
                        placeholder="Enter your delivery address"
                        required
                        rows="4"
                        style="width:100%; padding:14px; margin:8px 0 20px; border:1px solid #ddd; border-radius:8px;"
                    ></textarea>

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                        style="width:100%; padding:14px; margin:8px 0 25px; border:1px solid #ddd; border-radius:8px;"
                    >

                    <button
                        type="submit"
                        class="shop-btn"
                        style="border:none; cursor:pointer; width:100%;"
                    >
                        Place Order 📦
                    </button>

                </form>

            </div>

        </div>

    </div>

</section>

</body>
</html>
