{% extends "social/base.html" %}

{% block title %}
Register - SocialConnect
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Join SocialConnect today
        </p>

        <form
            method="POST"
            class="auth-form"
            autocomplete="off"
        >

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter a new username"
                    autocomplete="off"
                    autocapitalize="none"
                    spellcheck="false"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="off"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Minimum 8 characters"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
